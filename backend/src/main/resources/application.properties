# ============================================================
# application.properties — Spring Boot Configuration
# ============================================================

# Server port (default is 8080)
server.port=8080

# Application name (appears in logs)
spring.application.name=Trading Strategy Engine

# ---- Jackson JSON Configuration ----
# Serialize LocalDate as "2024-01-15" string (not array)
spring.jackson.serialization.write-dates-as-timestamps=false
# ISO 8601 date format
spring.jackson.date-format=yyyy-MM-dd
# Indent JSON output for readability (disable in production)
spring.jackson.serialization.indent-output=true
# Ignore unknown JSON fields during deserialization
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---- Logging ----
logging.level.com.trading=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# ---- HTTP Client timeout settings ----
spring.mvc.async.request-timeout=30000
